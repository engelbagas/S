<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HINON TECHNOLOGY V15 — Enterprise Management Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #2563eb; --primary-dark: #1d4ed8; --primary-light: #eff6ff;
  --dark: #0f172a; --darker: #020617;
  --bg: #f8fafc; --surface: #ffffff;
  --text: #0f172a; --muted: #64748b;
  --border: #e2e8f0; --success: #059669; --success-bg: #d1fae5;
  --warning: #d97706; --warning-bg: #fef3c7;
  --danger: #dc2626; --danger-bg: #fee2e2;
  --radius: 14px; --shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05);
}

[data-theme="dark"] {
  --bg: #0b0f19; --surface: #151c2c;
  --text: #f1f5f9; --muted: #94a3b8;
  --border: #28334e; --primary-light: #1e293b;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; transition: background 0.3s, color 0.3s; }
button, input, select, textarea { font: inherit; outline: none; }
button { cursor: pointer; border: none; border-radius: 10px; padding: 10px 18px; font-weight: 700; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
button:active { transform: scale(0.97); }

.primary { background: var(--primary); color: #fff; } .primary:hover { background: var(--primary-dark); }
.success { background: var(--success); color: #fff; }
.danger { background: var(--danger); color: #fff; }
.warning { background: var(--warning); color: #fff; }
.secondary { background: var(--muted); color: #fff; }
.outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.outline:hover { background: var(--primary-light); }
.hidden { display: none !important; }

/* Toast Notifications */
#toast-container { position: fixed; top: 20px; left: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; max-width: 320px; }
.toast { background: var(--surface); color: var(--text); padding: 14px 18px; border-radius: var(--radius); border-right: 5px solid var(--primary); box-shadow: 0 10px 30px rgba(0,0,0,0.15); font-size: 14px; font-weight: 600; animation: slideIn 0.3s ease; }
.toast.success { border-color: var(--success); } .toast.danger { border-color: var(--danger); }
@keyframes slideIn { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* Screen Layouts */
.screen { min-height: 100vh; padding: 20px; display: flex; align-items: center; justify-content: center; }
.auth { background: linear-gradient(135deg, var(--darker), var(--dark)); position: relative; }
.panel { background: var(--surface); border-radius: 24px; padding: 36px; width: min(100%, 650px); box-shadow: 0 20px 40px rgba(0,0,0,0.3); border: 1px solid var(--border); }
.panel h1, .panel h2 { text-align: center; margin-bottom: 8px; font-weight: 800; color: var(--text); }

/* Form Fields */
.field { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; }
.field label { font-size: 13px; font-weight: 700; color: var(--text); }
.field input, .field select, .field textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--text); transition: border 0.2s; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }

/* App Structure */
.app { display: none; min-height: 100vh; }
.app.active { display: flex; flex-direction: column; }
@media(min-width: 900px) { .app.active { flex-direction: row; } }

.sidebar { width: 100%; background: var(--dark); color: #fff; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
@media(min-width: 900px) { .sidebar { width: 270px; min-height: 100vh; position: fixed; top: 0; right: 0; bottom: 0; } }
.sidebar h2 { font-size: 22px; text-align: center; margin-bottom: 24px; font-weight: 900; color: #38bdf8; letter-spacing: 0.5px; }

.nav-container { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex: 1; }
.nav { width: 100%; text-align: right; background: transparent; color: #94a3b8; padding: 12px 16px; border-radius: 10px; font-weight: 600; border: none; justify-content: flex-start; }
.nav.active, .nav:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
#logout { margin-top: 20px; background: rgba(220, 38, 38, 0.15); color: #fca5a5; }
#logout:hover { background: var(--danger); color: #fff; }

.main { flex: 1; min-width: 0; }
@media(min-width: 900px) { .main { margin-right: 270px; } }

.top { background: var(--surface); padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; backdrop-filter: blur(8px); }
.content { padding: 28px; max-width: 1400px; margin: auto; }

/* Stats & Cards */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat, .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); margin-bottom: 20px; }
.stat small { color: var(--muted); font-weight: 700; font-size: 12px; }
.stat strong { display: block; font-size: 26px; margin-top: 6px; font-weight: 800; color: var(--text); }

/* Tables */
.table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); margin-top: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; text-align: right; background: var(--surface); }
th, td { padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { background: var(--primary-light); color: var(--muted); font-weight: 700; white-space: nowrap; }
tr:last-child td { border-bottom: none; }

.badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; text-align: center; }
.badge.green { background: var(--success-bg); color: var(--success); }
.badge.orange { background: var(--warning-bg); color: var(--warning); }
.badge.red { background: var(--danger-bg); color: var(--danger); }

/* Modal & Tools */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
.modal.active { display: flex; }
.modalbox { background: var(--surface); border-radius: 20px; padding: 28px; width: min(100%, 720px); max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); border: 1px solid var(--border); }
.notice { padding: 14px 18px; border-radius: 10px; background: var(--primary-light); color: var(--primary-dark); margin: 14px 0; font-size: 13px; border: 1px solid var(--border); font-weight: 600; }
.bar { height: 12px; background: var(--border); border-radius: 20px; overflow: hidden; margin: 10px 0; }
.bar span { display: block; height: 100%; background: var(--primary); border-radius: 20px; transition: width 0.5s ease; }

/* Voucher Print Style */
.voucher-card { border: 2px dashed var(--primary); padding: 16px; border-radius: 12px; text-align: center; background: var(--surface); }
.voucher-code { font-size: 20px; font-weight: 900; letter-spacing: 3px; color: var(--primary); margin: 8px 0; background: var(--primary-light); padding: 6px; border-radius: 8px; }

@media print { body * { visibility: hidden; } .modalbox, .modalbox * { visibility: visible; } .modalbox { position: absolute; left: 0; top: 0; width: 100%; } }
</style>
</head>
<body>

<div id="toast-container"></div>

<!-- شاشة الإعداد الأول للمدير -->
<section id="setup" class="screen auth">
  <div class="panel">
    <h1>HINON TECHNOLOGY</h1>
    <p class="muted" style="text-align:center; margin-bottom: 20px;">تهيئة المدير الرئيسي للشبكة (المسؤول الأول)</p>
    <form id="setupForm">
      <div class="field"><label>اسم مدير النظام</label><input id="setupUser" required autocomplete="username" placeholder="مثال: admin"></div>
      <div class="field"><label>كلمة المرور (8 عناصر على الأقل)</label><input id="setupPass" type="password" minlength="8" required autocomplete="new-password"></div>
      <button class="primary" style="width:100%; margin-top:12px;">تأكيد وإنشاء الحساب</button>
    </form>
  </div>
</section>

<!-- شاشة تسجيل الدخول -->
<section id="login" class="screen auth hidden">
  <div class="panel">
    <h1>HINON TECHNOLOGY</h1>
    <p class="muted" style="text-align:center; margin-bottom: 24px;">بوابة المشتركين وطاقم الإدارة والشبكات</p>
    <form id="loginForm">
      <div class="field"><label>اسم المستخدم / رقم الهاتف / حساب PPPoE</label><input id="loginUser" required autocomplete="username"></div>
      <div class="field"><label>كلمة المرور</label><input id="loginPass" type="password" required autocomplete="current-password"></div>
      <button class="primary" style="width:100%; margin-top:10px;">تسجيل الدخول</button>
    </form>
    <div class="actions" style="margin-top:15px; display:flex; gap:10px;">
      <button class="warning" style="flex:1;" id="toRegister">طلب اشتراك جديد</button>
      <button class="outline" id="toVoucherRedeem">شحن كرت</button>
    </div>
  </div>
</section>

<!-- شاشة شحن كروت التعبئة السريعة -->
<section id="voucherRedeem" class="screen auth hidden">
  <div class="panel" style="width: min(100%, 480px);">
    <h2>شحن رصيد / باقة بكرت</h2>
    <p class="muted" style="text-align:center; margin-bottom: 15px;">أدخل رقم الهاتف وكود الكرت لتفعيل الباقة فوراً</p>
    <form id="voucherForm">
      <div class="field"><label>رقم الهاتف المسجل</label><input id="vPhone" required placeholder="09xxxxxxxx"></div>
      <div class="field"><label>كود الكرت (Voucher Code)</label><input id="vCode" required placeholder="XXXX-XXXX-XXXX"></div>
      <button class="success" style="width:100%; margin-top:10px;">تفعيل الكرت الآن</button>
      <button type="button" class="outline" style="width:100%; margin-top:8px;" id="vBack">العودة لتسجيل الدخول</button>
    </form>
  </div>
</section>

<!-- شاشة طلب اشتراك جديد -->
<section id="register" class="screen auth hidden">
  <div class="panel" style="width: min(100%, 820px);">
    <h2>تقديم طلب اشتراك جديد</h2>
    <p class="muted" style="margin-bottom: 15px;">سيتم معالجة الطلب وتعيين الفني لتوصيل الخدمة.</p>
    <form id="registerForm">
      <div class="grid">
        <div class="field"><label>الاسم الكامل</label><input id="rName" required maxlength="100"></div>
        <div class="field"><label>رقم الهاتف</label><input id="rPhone" required maxlength="30"></div>
        <div class="field"><label>كلمة مرور الحساب</label><input id="rPass" type="password" minlength="8" required></div>
        <div class="field"><label>المدينة / المنطقة</label><input id="rCity" required></div>
        <div class="field"><label>الشارع / الحي</label><input id="rStreet" required></div>
        <div class="field"><label>رقم البناء / الشقة</label><input id="rHouse" required></div>
        <div class="field"><label>اسم البرج / الكبينة</label><input id="rTower" required></div>
        <div class="field"><label>طريقة التوصيل</label><select id="rSource"><option value="صحن">صحن / أنتينا</option><option value="علبة">علبة قريبة (كبل ضوئي/نحاسي)</option></select></div>
        <div class="field"><label>الباقة المطلوبة</label><select id="rPackage" required></select></div>
        <div class="field"><label>صحن استقبال؟</label><select id="rDish"><option value="no">لا</option><option value="yes">نعم</option></select></div>
        <div class="field"><label>راوتر موزّع؟</label><select id="rRouter"><option value="no">لا</option><option value="yes">نعم</option></select></div>
        <div class="field"><label>تمديد كبل؟</label><select id="rCable"><option value="yes">نعم</option><option value="no">لا</option></select></div>
        <div class="field"><label>طول الكبل (متر)</label><input id="rCableLength" type="number" min="0" value="15"></div>
        <div class="field"><label>المبلغ المدفوع مقدمًا ($)</label><input id="rPaid" type="number" min="0" step=".01" value="0"></div>
      </div>
      <div id="estimate" class="notice"></div>
      <div class="actions">
        <button class="success" style="flex:2;">إرسال الطلب للإدارة</button>
        <button type="button" class="secondary" id="registerBack" style="flex:1;">رجوع</button>
      </div>
    </form>
  </div>
</section>

<!-- لوحة النظام الرئيسية -->
<div id="app" class="app">
  <aside class="sidebar">
    <div>
      <h2>HINON TECH</h2>
      <div id="navItems" class="nav-container"></div>
    </div>
    <div style="display:flex; flex-direction:column; gap:8px;">
      <button class="outline" id="toggleTheme" style="color:#fff; border-color:rgba(255,255,255,0.2);">🌓 المظهر (ليلي/نهاري)</button>
      <button class="nav" id="logout">تسجيل الخروج</button>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div>
        <strong id="welcome" style="font-size: 18px;">لوحة التحكم</strong>
        <small id="roleTag" class="badge green" style="margin-right:8px;">محلي</small>
      </div>
      <div id="topActions" style="display:flex; gap:10px;"></div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- Modal النافذة المنبثقة -->
<div class="modal" id="modal">
  <div class="modalbox">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;">
      <h3 id="modalTitle" style="font-size: 18px;">تفاصيل</h3>
      <button class="danger" id="modalClose" style="padding: 6px 12px; font-size: 12px;">إغلاق</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
'use strict';

const $ = id => document.getElementById(id);
const KEY = 'hinon_v15_enterprise_db';

// Toast System
function showToast(msg, type = 'info') {
  const container = $('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => { toast.remove(); }, 3500);
}

// Initial Data & Mocking
const defaults = () => ({
  admin: null,
  users: [],
  packages: [
    {id:1, name:'2 ميجا الاقتصادية', price:15, speedKb:2000, discountNew:10, limitGb:100, throttledKb:512, days:30},
    {id:2, name:'4 ميجا Pro', price:25, speedKb:4000, discountNew:15, limitGb:200, throttledKb:1000, days:30},
    {id:3, name:'8 ميجا VIP', price:45, speedKb:8000, discountNew:20, limitGb:400, throttledKb:2000, days:30}
  ],
  hardware: {installation:10, cableM:0.5, dish:40, router:25, box:15},
  finance: {debtDays:5, minPayment:5},
  requests: [], tickets: [], logs: [], vouchers: [],
  settings: {qr:'', iban:'', ticker:'أهلاً بكم في HINON TECHNOLOGY V15', autoCutoff: true}
});

let db;
try {
  db = {...defaults(), ...JSON.parse(localStorage.getItem(KEY) || '{}')};
  const d = defaults();
  for (const k of Object.keys(d)) if (db[k] === undefined) db[k] = d[k];
} catch {
  db = defaults();
}

let session = null, activePage = 'home';

function persist() {
  try {
    localStorage.setItem(KEY, JSON.stringify(db));
    return true;
  } catch {
    showToast('تعذر حفظ البيانات! التخزين محلي ممتلئ.', 'danger');
    return false;
  }
}

function log(action) {
  db.logs.unshift({date: new Date().toLocaleString('ar'), user: session?.name || 'النظام', action});
  db.logs = db.logs.slice(0, 500);
  persist();
}

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function money(n) { return '$' + (Number(n) || 0).toFixed(2); }

function datePlus(days) {
  let d = new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function screen(id) {
  ['setup', 'login', 'register', 'voucherRedeem'].forEach(x => $(x).classList.toggle('hidden', x !== id));
  $('app').classList.remove('active');
}

function modal(title, html) {
  $('modalTitle').textContent = title;
  $('modalBody').innerHTML = html;
  $('modal').classList.add('active');
}

function closeModal() { $('modal').classList.remove('active'); }
$('modalClose').onclick = closeModal;

// Theme Toggle
$('toggleTheme').onclick = () => {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  showToast(`تم التغيير للوضع ${next === 'dark' ? 'الليلـي' : 'النهاري'}`, 'info');
};

function init() {
  if (!db.admin) screen('setup');
  else screen('login');
  fillPackages();
  $('rPackage').onchange = estimate;
  $('rPaid').oninput = estimate;
  ['rDish', 'rRouter', 'rCable', 'rCableLength', 'rSource'].forEach(id => $(id).addEventListener('change', estimate));$('rCableLength').addEventListener('input', estimate);
}

// Admin Setup
$('setupForm').onsubmit = e => {
  e.preventDefault();
  db.admin = {username: $('setupUser').value.trim(), password:$('setupPass').value};
  persist();
  log('إنشاء حساب مدير النظام الأول');
  showToast('تم إنشاء حساب المدير بنجاح', 'success');
  screen('login');
};

// Login System
$('loginForm').onsubmit = e => {
  e.preventDefault();
  const name = $('loginUser').value.trim(), pass =$('loginPass').value;
  if (db.admin && name === db.admin.username && pass === db.admin.password) {
    session = {role: 'admin', name: db.admin.username};
    openApp();
    showToast('مرحباً بك يا مدير النظام', 'success');
    return;
  }
  const u = db.users.find(x => (x.phone === name || x.pppoeUser === name || x.name === name) && x.password === pass);
  if (!u) { showToast('بيانات الدخول غير صحيحة!', 'danger'); return; }
  if (['بانتظار الموافقة', 'مرفوض'].includes(u.status)) { showToast('حسابك ما زال قيد المراجعة أو مرفوض', 'warning'); return; }
  
  session = {role: u.role || 'client', ...u};
  openApp();
  showToast(`أهلاً بعودتك، ${u.name}`, 'success');
};

// Vouchers Redeem
$('toVoucherRedeem').onclick = () => screen('voucherRedeem');
$('vBack').onclick = () => screen('login');$('voucherForm').onsubmit = e => {
  e.preventDefault();
  const phone = $('vPhone').value.trim(), code =$('vCode').value.trim();
  const u = db.users.find(x => x.phone === phone);
  if (!u) { showToast('رقم الهاتف غير مسجل بالنظام', 'danger'); return; }
  const vIndex = db.vouchers.findIndex(v => v.code === code && !v.used);
  if (vIndex === -1) { showToast('كود الكرت غير صالح أو مستخدم مسبقاً', 'danger'); return; }
  
  const v = db.vouchers[vIndex];
  v.used = true;
  v.usedBy = phone;
  v.usedAt = new Date().toLocaleString('ar');
  
  u.exp = datePlus(v.days || 30);
  u.status = 'نشط';
  persist();
  log(`شحن كرت (${code}) للمشترك ${phone}`);
  showToast(`تم شحن ${v.pkgName} بنجاح!`, 'success');
  screen('login');
};

$('toRegister').onclick = () => { fillPackages(); screen('register'); estimate(); };$('registerBack').onclick = () => screen('login');

function fillPackages() {
  $('rPackage').innerHTML = db.packages.map(p => `<option value="${p.id}">${esc(p.name)} — ${money(p.price)} (${p.speedKb} KB)</option>`).join('');
}

function estimate() {
  if (!$('rPackage').options.length) return;
  const p = db.packages.find(p => p.id === Number($('rPackage').value)) || db.packages[0];
  if (!p) return;
  let hw = $('rSource').value === 'علبة' ? db.hardware.box : ($('rDish').value === 'yes' ? db.hardware.dish : 0);
  if ($('rRouter').value === 'yes') hw += db.hardware.router;
  if ($('rCable').value === 'yes') hw += Math.max(0, Number($('rCableLength').value) || 0) * db.hardware.cableM;
  const discount = p.price * (p.discountNew || 0) / 100;
  const total = p.price - discount + db.hardware.installation + hw;
  const paid = Math.max(0, Number($('rPaid').value) \vert{}\vert{} 0);$('estimate').innerHTML = `سعر الباقة: <b>${money(p.price)}</b> | الخصم: <b>${money(discount)}</b> | التركيب والعتاد: <b>${money(db.hardware.installation + hw)}</b><br>الإجمالي: <b>${money(total)}</b> | المدفوع: <b>${money(paid)}</b> | المتبقي: <b>${money(Math.max(0, total - paid))}</b>`;
}

$('registerForm').onsubmit = e => {
  e.preventDefault();
  const phone = $('rPhone').value.trim();
  if (db.users.some(u => u.phone === phone)) { showToast('رقم الهاتف مسجل مسبقاً!', 'danger'); return; }
  const p = db.packages.find(x => x.id === Number($('rPackage').value));
  if (!p) return;
  
  const price = p.price * (1 - (p.discountNew || 0) / 100);
  let hw = $('rSource').value === 'علبة' ? db.hardware.box : ($('rDish').value === 'yes' ? db.hardware.dish : 0);
  if ($('rRouter').value === 'yes') hw += db.hardware.router;
  if ($('rCable').value === 'yes') hw += Math.max(0, Number($('rCableLength').value) || 0) * db.hardware.cableM;
  
  const total = price + db.hardware.installation + hw, paid = Math.max(0, Number($('rPaid').value) || 0);
  if (paid > total) { showToast('المبلغ المدفوع يتجاوز إجمالي التكلفة!', 'danger'); return; }

  const user = {
    id: String(Date.now()), role: 'client', name: $('rName').value.trim(), phone, password:$('rPass').value,
    city: $('rCity').value.trim(), street: $('rStreet').value.trim(), house:$('rHouse').value.trim(),
    tower: $('rTower').value.trim(), source:$('rSource').value, hardware: hw, pkgName: p.name,
    paid, debt: Math.max(0, total - paid), total, usedGb: 0,
    pppoeUser: 'hn_' + phone.replace(/\D/g, '').slice(-8), pppoePass: String(Math.floor(100000 + Math.random() * 900000)),
    exp: 'غير مفعل', debtDueDate: datePlus(db.finance.debtDays), status: 'بانتظار الموافقة'
  };
  
  db.users.push(user);
  db.requests.unshift({id: user.id, phone, name: user.name, type: 'اشتراك جديد', pkgName: p.name, total, paidAmount: paid, debt: user.debt, txn: '', status: 'بانتظار الموافقة', date: new Date().toLocaleString('ar')});
  persist();
  log('طلب اشتراك جديد من: ' + phone);
  showToast('تم تقديم الطلب بنجاح وهو قيد الموافقة', 'success');
  $('registerForm').reset();
  fillPackages();
  screen('login');
};

function openApp() {

function buildNav() {
  const admin = session.role === 'admin';
  const tech = session.role === 'tech';
  
  let items = [];
  if (admin) {
    items = [
      ['home', '📊 الرئيسية'], ['requests', '📥 الطلبات والدفعات'], ['users', '👥 المشتركون والشبكة'],
      ['vouchers', '🎫 كروت الشحن'], ['packages', '⚡ الباقات والخدمات'], ['finance', '💰 المالية والتقارير'],
      ['support', '💬 الدعم الفني'], ['settings', '⚙️ إعدادات النظام'], ['logs', '📜 سجل النشاطات']
    ];
  } else if (tech) {
    items = [
      ['home', '📊 الرئيسية'], ['users', '👥 المشتركون والشبكة'], ['support', '💬 تذاكر الدعم']
    ];

      ['home', '🏠 حسابي والتفاصيل'], ['pay', '💳 التجديد والدفعات'], ['support', '💬 الدعم الفني']
    ];
  }
  
  $('navItems').innerHTML = items.map(([id, label]) => `<button class="nav ${activePage === id ? 'active' : ''}" data-page="${id}">${label}</button>`).join('');
  $('navItems').querySelectorAll('button').forEach(b => b.onclick = () => { activePage = b.dataset.page; buildNav(); render(); });
}

function table(headers, rows) {
  return `<div class="table-wrap"><table><thead><tr>${headers.map(x => `<th>${x}</th>`).join('')}</tr></thead><tbody>${rows || `<tr><td colspan="${headers.length}" style="text-align:center; padding:20px;" class="muted">لا توجد بيانات لعرضها</td></tr>`}</tbody></table></div>`;
}

function btn(label, cls, action) {
  return `<button class="${cls}" data-action="${action}">${label}</button>`;
}

    <td><span class="badge ${u.status==='نشط'?'green':'red'}">${esc(u.status)}</span></td>

function bindPageEvents() {
  $('content').querySelectorAll('[data-action]').forEach(b => b.onclick = () => act(b.dataset.action));
  
  if ($('userSearch'))$('userSearch').oninput = () => {
    const q = $('userSearch').value.toLowerCase();$('usersTable').innerHTML = usersTable(db.users.filter(u => (u.name + u.phone + u.pppoeUser).toLowerCase().includes(q)));
  };

  if ($('genVoucherForm'))$('genVoucherForm').onsubmit = e => {
    e.preventDefault();
    const pkgId = Number($('vPkg').value);
    const count = Number($('vCount').value) || 1;
    const pkg = db.packages.find(p => p.id === pkgId);
    if (!pkg) return;
    
    for (let i = 0; i < count; i++) {
      const code = 'HN-' + Math.floor(1000 + Math.random() * 9000) + '-' + Math.floor(1000 + Math.random() * 9000);
      db.vouchers.unshift({code, pkgName: pkg.name, days: pkg.days || 30, used: false, usedBy: null, usedAt: null});
    }
    persist();
    log(`توليد ${count} كروت لشحن ${pkg.name}`);
    showToast(`تم توليد ${count} كرت بنجاح`, 'success');
    render();
  };

  if ($('addUser'))$('addUser').onclick = () => modal('إضافة مشترك جديد', `<form id="manualUser"><div class="grid"><div class="field"><label>الاسم</label><input id="muName" required></div><div class="field"><label>الهاتف</label><input id="muPhone" required></div><div class="field"><label>كلمة المرور</label><input id="muPass" minlength="8" required></div><div class="field"><label>الباقة</label><select id="muPkg">${db.packages.map(p => `<option>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>الدين ($)</label><input id="muDebt" type="number" min="0" step=".01" value="0"></div></div><button class="success" style="margin-top:15px; width:100%;">حفظ وإضافة المشترك</button></form>`);
  
  if ($('manualUser'))$('manualUser').onsubmit = e => {
    e.preventDefault();
    const phone = $('muPhone').value.trim();
    if (db.users.some(u => u.phone === phone)) { showToast('الهاتف مسجل مسبقاً', 'danger'); return; }
    const u = {
      id: String(Date.now()), role: 'client', name: $('muName').value.trim(), phone, password:$('muPass').value,
      pkgName: $('muPkg').value, debt: Number($('muDebt').value) || 0, usedGb: 0,
      pppoeUser: 'hn_' + Date.now().toString().slice(-8), pppoePass: String(Math.floor(100000 + Math.random() * 900000)),
      exp: datePlus(30), status: 'نشط'
    };
    db.users.push(u);
    persist();
    log('إضافة مشترك يدوي: ' + phone);
    closeModal();
    showToast('تمت إضافة المشترك بنجاح', 'success');
    render();
  };

  if ($('pkgForm'))$('pkgForm').onsubmit = e => {
    e.preventDefault();
    db.packages.push({
      id: Date.now(), name: $('pName').value.trim(), price: Number($('pPrice').value),
      speedKb: Number($('pSpeed').value), discountNew: Number($('pDiscount').value),
      limitGb: Number($('pLimit').value), throttledKb: Number($('pThrottle').value), days: 30
    });
    persist();
    log('إضافة باقة جديدة');
    showToast('تمت إضافة الباقة', 'success');
    render();
  };

  if ($('financeForm'))$('financeForm').onsubmit = e => {
    e.preventDefault();
    db.finance = {debtDays: Number($('debtDays').value), minPayment: Number($('minPay').value)};
    persist();
    showToast('تم حفظ شروط السداد', 'success');
  };

  if ($('settingsForm'))$('settingsForm').onsubmit = e => {
    e.preventDefault();
    db.settings.iban = $('iban').value.trim();
    db.settings.qr = $('qr').value.trim();
    db.settings.ticker = $('ticker').value.trim();
    persist();
    showToast('تم حفظ إعدادات النظام', 'success');
  };

  if ($('ticketForm'))$('ticketForm').onsubmit = e => {
    e.preventDefault();
    const u = db.users.find(x => x.id === session.id) || session;
    db.tickets.unshift({id: String(Date.now()), phone: u.phone, userName: u.name, subject: $('ticketSubject').value.trim(), body:$('ticketBody').value.trim(), reply: '', status: 'قيد الانتظار', date: new Date().toLocaleString('ar')});
    persist();
    showToast('تم إرسال بلاغك بنجاح', 'success');
    render();
  };

  if ($('payForm'))$('payForm').onsubmit = e => {
    e.preventDefault();
    const u = db.users.find(x => x.id === session.id) || session;
    const type = $('payType').value, amount = Number($('payAmount').value), txn =$('payTxn').value.trim();
    if (amount <= 0 || !txn) { showToast('تحقق من صحة المبلغ ورقم العملية', 'danger'); return; }
    db.requests.unshift({id: String(Date.now()), phone: u.phone, name: u.name, type, pkgName: u.pkgName, paidAmount: amount, txn, status: 'بانتظار الموافقة', date: new Date().toLocaleString('ar')});
    persist();
    showToast('تم إرسال عملية الدفع للمراجعة', 'success');
    render();
  };

  if ($('exportUsers'))$('exportUsers').onclick = () => csv('hinon-users.csv', db.users);
  if ($('exportReq'))$('exportReq').onclick = () => csv('hinon-requests.csv', db.requests);
  if ($('reset'))$('reset').onclick = () => {
    if (confirm('هل أنت متأكد تماماً من حذف كل بيانات النظام بشكل دائم؟')) {
      localStorage.removeItem(KEY);
      location.reload();
    }
  };
}

function act(action) {
  const [kind, id] = action.split(':');
  
  if (kind === 'receipt') {
    const u = db.users.find(x => x.id === id); if (!u) return;
    modal('إيصال سداد وباقة رسمي', `
      <div style="text-align:center; padding:10px;">
        <h2>HINON TECHNOLOGY</h2>
        <p class="muted">إيصال حساب مشترك وتفاصيل الخدمة</p>
        <hr style="margin:15px 0;">
        <div style="text-align:right; font-size:14px; line-height:2;">
          <p>اسم المشترك: <b>${esc(u.name)}</b></p>
          <p>رقم الهاتف: <b>${esc(u.phone)}</b></p>
          <p>اسم المستخدم PPPoE: <code>${esc(u.pppoeUser)}</code></p>
          <p>الباقة الحالية: <b>${esc(u.pkgName)}</b></p>
          <p>تاريخ الانتهاء: <b>${esc(u.exp)}</b></p>
          <p>الدين المستحق: <b style="color:var(--danger);">${money(u.debt)}</b></p>
        </div>
        <button class="primary" style="margin-top:20px; width:100%;" onclick="window.print()">🖨️ طباعة الإيصال</button>
      </div>
    `);
  }
  else if (kind === 'approve') {
    const r = db.requests.find(x => x.id === id); if (!r) return;
    if (!confirm('تأكيد الموافقة على الطلب والتفعيل؟')) return;
    const u = db.users.find(x => x.id === r.id || x.phone === r.phone);
    if (u) {
      if (r.type === 'اشتراك جديد') { u.status = 'نشط'; u.exp = datePlus(30); u.debt = Math.max(0, Number(r.debt) || 0); }
      else if (r.type === 'تسديد دين') { u.debt = Math.max(0, (Number(u.debt) || 0) - Number(r.paidAmount || 0)); }
      else if (r.type === 'تجديد باقة') { u.exp = datePlus(30); u.usedGb = 0; u.status = 'نشط'; }
    }
    db.requests = db.requests.filter(x => x.id !== id);
    persist();
    showToast('تمت الموافقة وتحديث بيانات الحساب', 'success');
    render();
  }
  else if (kind === 'reject') {
    if (!confirm('تأكيد رفض هذا الطلب؟')) return;
    db.requests = db.requests.filter(x => x.id !== id);
    persist();
    showToast('تم رفض الطلب', 'info');
    render();
  }
  else if (kind === 'delpkg') {
    if (confirm('تأكيد حذف هذه الباقة؟')) {
      db.packages = db.packages.filter(p => String(p.id) !== id);
      persist();
      showToast('تم حذف الباقة', 'info');
      render();
    }
  }
  else if (kind === 'toggle') {
    const u = db.users.find(x => x.id === id);
    if (u) {
      u.status = u.status === 'نشط' ? 'موقوف' : 'نشط';
      persist();
      showToast(`تم تغيير حالة الحساب إلى: ${u.status}`, 'info');
      render();
    }
  }
  else if (kind === 'delete') {
    if (confirm('حذف حساب المشترك نهائياً؟')) {
      db.users = db.users.filter(u => u.id !== id);
      persist();
      showToast('تم حذف حساب المشترك', 'info');
      render();
    }
  }
  else if (kind === 'edit') {
    const u = db.users.find(x => x.id === id); if (!u) return;
    modal('تعديل بيانات المشترك', `
      <form id="editUser">
        <div class="grid">
          <div class="field"><label>الاسم الكامل</label><input id="euName" value="${esc(u.name)}" required></div>
          <div class="field"><label>المبلغ المستحق ($)</label><input id="euDebt" type="number" step=".01" value="${Number(u.debt)||0}" required></div>
          <div class="field"><label>تاريخ الانتهاء</label><input id="euExp" value="${esc(u.exp)}"></div>
          <div class="field"><label>الحالة</label><select id="euStatus">${['نشط', 'موقوف', 'بانتظار الموافقة'].map(s => `<option ${s === u.status ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
        </div>
        <button class="primary" style="margin-top:15px; width:100%;">حفظ التعديلات</button>
      </form>
    `);
    $('editUser').onsubmit = e => {
      e.preventDefault();
      u.name = $('euName').value.trim();
      u.debt = Number($('euDebt').value) || 0;
      u.exp = $('euExp').value;
      u.status = $('euStatus').value;
      persist();
      closeModal();
      showToast('تم التعديل بنجاح', 'success');
      render();
    };
  }
  else if (kind === 'reply') {
    const t = db.tickets.find(x => x.id === id); if (!t) return;
    const ans = prompt('اكتب الرد الرسمي للمشترك:', t.reply || '');
    if (ans !== null) {
      t.reply = ans.trim();
      t.status = 'تم الرد';
      persist();
      showToast('تم تسجيل الرد على التذكرة', 'success');
      render();
    }
  }
}

function csv(filename, rows) {
  if (!rows.length) return showToast('لا توجد بيانات للتصدير', 'warning');
  const keys = [...new Set(rows.flatMap(Object.keys))];
  const quote = v => '"' + String(typeof v === 'object' && v !== null ? JSON.stringify(v) : v ?? '').replace(/"/g, '""') + '"';
  const text = '\ufeff' + [keys.map(quote).join(','), ...rows.map(r => keys.map(k => quote(r[k])).join(','))].join('\r\n');
  const blob = new Blob([text], {type: 'text/csv;charset=utf-8;'}), url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = filename; a.click(); URL.revokeObjectURL(url);
}

$('logout').onclick = () => {
  session = null;
  activePage = 'home';
  screen('login');
  showToast('تم تسجيل الخروج', 'info');
};

init();
</script>
