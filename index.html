<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HINON TECHNOLOGY V13 — النسخة المنظمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#2563eb;--dark:#0f172a;--bg:#f1f5f9;--surface:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--success:#059669;--warning:#d97706;--danger:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:9px 14px;font-weight:700}.primary{background:var(--primary);color:white}.success{background:var(--success);color:white}.danger{background:var(--danger);color:white}.warning{background:var(--warning);color:white}.secondary{background:#64748b;color:white}.muted{color:var(--muted)}.hidden{display:none!important}.screen{min-height:100vh;padding:24px;display:flex;align-items:center;justify-content:center}.auth{background:linear-gradient(135deg,#0f172a,#1d4ed8)}.panel{background:white;border-radius:16px;padding:26px;width:min(100%,720px);box-shadow:0 12px 32px #0002}.panel h1,.panel h2{text-align:center;margin-top:0}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.app{display:none;min-height:100vh}.app.active{display:flex}.sidebar{width:240px;flex-shrink:0;background:var(--dark);color:white;padding:18px 12px}.sidebar h2{font-size:18px;text-align:center}.nav{display:block;width:100%;text-align:right;background:transparent;color:white;margin:5px 0}.nav.active,.nav:hover{background:#ffffff24}.main{min-width:0;flex:1}.top{background:white;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--border);flex-wrap:wrap}.content{padding:20px;max-width:1500px;margin:auto}.page{display:none}.page.active{display:block}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}.stat,.card{background:white;border:1px solid var(--border);border-radius:12px;padding:17px;margin-bottom:15px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:23px;margin-top:4px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:right;padding:10px;border-bottom:1px solid var(--border);white-space:normal;vertical-align:top}th{background:#f8fafc;color:var(--muted);white-space:nowrap}.badge{display:inline-block;padding:3px 8px;border-radius:6px;background:#e2e8f0;font-size:11px;font-weight:700}.badge.green{background:#d1fae5;color:#065f46}.badge.orange{background:#fef3c7;color:#92400e}.badge.red{background:#fee2e2;color:#991b1b}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.active{display:flex}.modalbox{background:white;border-radius:14px;padding:22px;width:min(100%,650px);max-height:90vh;overflow:auto}.notice{padding:12px;border-radius:8px;background:#eff6ff;margin:12px 0;font-size:13px}.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.inline input{flex:1;min-width:160px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}.toolbar input{padding:9px;border:1px solid var(--border);border-radius:8px}.bar{height:10px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin:8px 0}.bar span{display:block;height:100%;background:var(--primary)}@media(max-width:800px){.app.active{display:block}.sidebar{width:100%;padding:10px}.sidebar h2{margin:5px}.nav{display:inline-block;width:auto}.content{padding:12px}.top{padding:12px}.screen{padding:12px}.panel{padding:18px}th,td{min-width:100px}}
</style>
</head>
<body>
<section id="setup" class="screen auth">
 <div class="panel"><h1>HINON TECHNOLOGY</h1><p class="muted" style="text-align:center">إعداد حساب المدير الرئيسي</p>
 <form id="setupForm"><div class="field"><label>اسم المدير</label><input id="setupUser" required autocomplete="username"></div><div class="field"><label>كلمة المرور (8 أحرف على الأقل)</label><input id="setupPass" type="password" minlength="8" required autocomplete="new-password"></div><button class="primary" style="width:100%">إنشاء حساب المدير</button></form></div>
</section>
<section id="login" class="screen auth hidden"><div class="panel"><h1>HINON TECHNOLOGY</h1><p class="muted" style="text-align:center">بوابة المشتركين والإدارة</p>
<form id="loginForm"><div class="field"><label>اسم المستخدم أو رقم الهاتف</label><input id="loginUser" required autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="loginPass" type="password" required autocomplete="current-password"></div><button class="primary" style="width:100%">تسجيل الدخول</button></form><div class="actions"><button class="warning" style="width:100%" id="toRegister">طلب اشتراك جديد</button></div></div></section>
<section id="register" class="screen auth hidden"><div class="panel"><h2>طلب اشتراك جديد</h2><p class="muted">يُرسل الطلب للإدارة للمراجعة. لا يتم تفعيل الخدمة أو إثبات الدفع تلقائيًا.</p>
<form id="registerForm"><div class="grid">
<div class="field"><label>الاسم الكامل</label><input id="rName" required maxlength="100"></div>
<div class="field"><label>رقم الهاتف</label><input id="rPhone" required maxlength="30"></div>
<div class="field"><label>كلمة مرور الحساب</label><input id="rPass" type="password" minlength="8" required></div>
<div class="field"><label>المدينة / المنطقة</label><input id="rCity" required></div>
<div class="field"><label>الشارع</label><input id="rStreet" required></div>
<div class="field"><label>رقم البناء / الشقة</label><input id="rHouse" required></div>
<div class="field"><label>البرج / الكبينة</label><input id="rTower" required></div>
<div class="field"><label>طريقة التوصيل</label><select id="rSource"><option value="صحن">صحن / أنتينا</option><option value="علبة">علبة قريبة</option></select></div>
<div class="field"><label>الباقة</label><select id="rPackage" required></select></div>
<div class="field"><label>صحن استقبال مطلوب؟</label><select id="rDish"><option value="no">لا</option><option value="yes">نعم</option></select></div>
<div class="field"><label>راوتر مطلوب؟</label><select id="rRouter"><option value="no">لا</option><option value="yes">نعم</option></select></div>
<div class="field"><label>تمديد كبل؟</label><select id="rCable"><option value="yes">نعم</option><option value="no">لا</option></select></div>
<div class="field"><label>طول الكبل بالمتر</label><input id="rCableLength" type="number" min="0" value="15"></div>
<div class="field"><label>المبلغ المدفوع مقدمًا ($)</label><input id="rPaid" type="number" min="0" step=".01" value="0"></div>
</div><div id="estimate" class="notice"></div><div class="actions"><button class="success">إرسال طلب الاشتراك</button><button type="button" class="secondary" id="registerBack">رجوع</button></div></form></div></section>
<div id="app" class="app"><aside class="sidebar"><h2>HINON TECH</h2><div id="navItems"></div><button class="nav" id="logout">تسجيل الخروج</button></aside><main class="main"><header class="top"><strong id="welcome">لوحة التحكم</strong><span id="roleTag" class="badge">محلي</span></header><div class="content" id="content"></div></main></div>
<div class="modal" id="modal"><div class="modalbox"><div class="toolbar"><h3 id="modalTitle">تفاصيل</h3><button class="danger" id="modalClose">إغلاق</button></div><div id="modalBody"></div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const KEY='hinon_v13_clean_data';
const defaults=()=>({admin:null,users:[],packages:[
{id:1,name:'2 ميجا الاقتصادية',price:15,speedKb:2000,discountNew:10,limitGb:100,throttledKb:512,days:30},
{id:2,name:'4 ميجا Pro',price:25,speedKb:4000,discountNew:15,limitGb:200,throttledKb:1000,days:30},
{id:3,name:'8 ميجا VIP',price:45,speedKb:8000,discountNew:20,limitGb:400,throttledKb:2000,days:30}],
hardware:{installation:10,cableM:.5,dish:40,router:25,box:15},finance:{debtDays:5,minPayment:5},requests:[],tickets:[],logs:[],settings:{qr:'',iban:'',ticker:'أهلاً بكم في HINON TECHNOLOGY'}});
let db;try{db={...defaults(),...JSON.parse(localStorage.getItem(KEY)||'{}')};const d=defaults();for(const k of Object.keys(d))if(db[k]===undefined)db[k]=d[k];}catch{db=defaults()}
let session=null, activePage='home';
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('تعذر حفظ البيانات محليًا. قد تكون مساحة التخزين ممتلئة.');return false}}
function log(action){db.logs.unshift({date:new Date().toLocaleString('ar'),user:session?.name||'النظام',action});db.logs=db.logs.slice(0,300);persist()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return '$'+(Number(n)||0).toFixed(2)}
function datePlus(days){let d=new Date();d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
function screen(id){['setup','login','register'].forEach(x=>$(x).classList.toggle('hidden',x!==id));$('app').classList.remove('active')}
function modal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.add('active')}
function closeModal(){$('modal').classList.remove('active')}
$('modalClose').onclick=closeModal;
function init(){if(!db.admin)screen('setup');else screen('login');fillPackages();$('rPackage').onchange=estimate;$('rPaid').oninput=estimate;['rDish','rRouter','rCable','rCableLength','rSource'].forEach(id=>$(id).addEventListener('change',estimate));$('rCableLength').addEventListener('input',estimate)}
$('setupForm').onsubmit=e=>{e.preventDefault();db.admin={username:$('setupUser').value.trim(),password:$('setupPass').value};persist();log('إنشاء حساب المدير');screen('login')};
$('loginForm').onsubmit=e=>{e.preventDefault();const name=$('loginUser').value.trim(),pass=$('loginPass').value; if(db.admin&&name===db.admin.username&&pass===db.admin.password){session={role:'admin',name};openApp();return}const u=db.users.find(x=>(x.phone===name||x.pppoeUser===name)&&x.password===pass);if(!u)return alert('بيانات الدخول غير صحيحة');if(['بانتظار الموافقة','مرفوض'].includes(u.status))return alert('حالة الحساب: '+u.status);session={role:'client',...u};openApp()};
$('toRegister').onclick=()=>{fillPackages();screen('register');estimate()};$('registerBack').onclick=()=>screen('login');
function fillPackages(){$('rPackage').innerHTML=db.packages.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)} — ${p.speedKb} KB</option>`).join('')}
function estimate(){if(!$('rPackage').options.length)return;const p=db.packages.find(p=>p.id===Number($('rPackage').value))||db.packages[0];if(!p)return;let hw=$('rSource').value==='علبة'?db.hardware.box:($('rDish').value==='yes'?db.hardware.dish:0);if($('rRouter').value==='yes')hw+=db.hardware.router;if($('rCable').value==='yes')hw+=Math.max(0,Number($('rCableLength').value)||0)*db.hardware.cableM;const discount=p.price*(p.discountNew||0)/100;const total=p.price-discount+db.hardware.installation+hw;const paid=Math.max(0,Number($('rPaid').value)||0);$('estimate').innerHTML=`سعر الباقة: <b>${money(p.price)}</b> | الخصم: <b>${money(discount)}</b> | التركيب: <b>${money(db.hardware.installation)}</b> | العتاد والكبل: <b>${money(hw)}</b><br>الإجمالي: <b>${money(total)}</b> | المدفوع: <b>${money(paid)}</b> | المتبقي: <b>${money(Math.max(0,total-paid))}</b>`}
$('registerForm').onsubmit=e=>{e.preventDefault();const phone=$('rPhone').value.trim();if(db.users.some(u=>u.phone===phone))return alert('رقم الهاتف مسجل مسبقًا');const p=db.packages.find(x=>x.id===Number($('rPackage').value));if(!p)return alert('اختر باقة صالحة');const price=p.price*(1-(p.discountNew||0)/100);let hw=$('rSource').value==='علبة'?db.hardware.box:($('rDish').value==='yes'?db.hardware.dish:0);if($('rRouter').value==='yes')hw+=db.hardware.router;if($('rCable').value==='yes')hw+=Math.max(0,Number($('rCableLength').value)||0)*db.hardware.cableM;const total=price+db.hardware.installation+hw,paid=Math.max(0,Number($('rPaid').value)||0);if(paid>total)return alert('المبلغ المدفوع لا يمكن أن يتجاوز إجمالي التكلفة');const user={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),role:'client',name:$('rName').value.trim(),phone,password:$('rPass').value,city:$('rCity').value.trim(),street:$('rStreet').value.trim(),house:$('rHouse').value.trim(),tower:$('rTower').value.trim(),source:$('rSource').value,hardware:hw,pkgName:p.name,paid,debt:Math.max(0,total-paid),total,usedGb:0,pppoeUser:'hn_'+phone.replace(/\D/g,'').slice(-8),pppoePass:'غير مُنشأ',staticIp:'تلقائي (DHCP)',exp:'غير مفعل',debtDueDate:datePlus(db.finance.debtDays),status:'بانتظار الموافقة'};db.users.push(user);db.requests.unshift({id:user.id,phone,name:user.name,type:'اشتراك جديد',pkgName:p.name,total,paidAmount:paid,debt:user.debt,txn:'',status:'بانتظار الموافقة',date:new Date().toLocaleString('ar')});persist();log('استلام طلب اشتراك جديد: '+phone);alert('تم إرسال طلبك للإدارة. انتظر الموافقة.');$('registerForm').reset();fillPackages();screen('login')};
function openApp(){screen('login');$('app').classList.add('active');$('welcome').textContent=session.name;$('roleTag').textContent=session.role==='admin'?'مدير':'مشترك';buildNav();render()}
function buildNav(){const items=session.role==='admin'?[['home','الرئيسية'],['requests','طلبات الاشتراك والدفع'],['users','المشتركون'],['packages','الباقات والأسعار'],['finance','المالية'],['support','الدعم الفني'],['settings','الإعدادات'],['logs','سجل النشاطات']]:[['home','حسابي'],['pay','الدفعات والتجديد'],['support','الدعم الفني']];$('navItems').innerHTML=items.map(([id,label])=>`<button class="nav ${activePage===id?'active':''}" data-page="${id}">${label}</button>`).join('');$('navItems').querySelectorAll('button').forEach(b=>b.onclick=()=>{activePage=b.dataset.page;buildNav();render()})}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}">لا توجد بيانات</td></tr>`}</tbody></table></div>`}
function btn(label,cls,action){return `<button class="${cls}" data-action="${action}">${label}</button>`}
function render(){if(!session)return;const admin=session.role==='admin';let html='';
if(admin&&activePage==='home'){html=`<div class="stats"><div class="stat"><small>المشتركون</small><strong>${db.users.length}</strong></div><div class="stat"><small>الطلبات المعلقة</small><strong>${db.requests.filter(r=>r.status.includes('انتظار')).length}</strong></div><div class="stat"><small>إجمالي الديون</small><strong>${money(db.users.reduce((s,u)=>s+(Number(u.debt)||0),0))}</strong></div><div class="stat"><small>تذاكر الدعم المفتوحة</small><strong>${db.tickets.filter(t=>t.status==='قيد الانتظار').length}</strong></div></div><div class="card"><h3>نظرة عامة</h3><p>هذه نسخة محلية تحفظ البيانات في هذا المتصفح فقط. لم يتم ربطها بخادم سحابي أو جهاز MikroTik.</p></div>`}
else if(admin&&activePage==='requests'){html=`<div class="card"><div class="toolbar"><h3>طلبات الاشتراك والدفعات</h3><button class="primary" id="exportReq">تصدير CSV</button></div>${table(['الاسم / الهاتف','نوع الطلب','التفاصيل','المبلغ','رقم العملية','الحالة','الإجراء'],db.requests.map(r=>`<tr><td>${esc(r.name)}<br>${esc(r.phone)}</td><td>${esc(r.type)}</td><td>${esc(r.pkgName||'—')}</td><td>الإجمالي ${money(r.total)}<br>مدفوع ${money(r.paidAmount)}<br>دين ${money(r.debt)}</td><td>${esc(r.txn||'لم يُدخل')}</td><td>${esc(r.status)}</td><td>${btn('موافقة','success','approve:'+r.id)} ${btn('رفض','danger','reject:'+r.id)} ${btn('رقم العملية','secondary','txn:'+r.id)}</td></tr>`).join(''))}</div>`}
else if(admin&&activePage==='users'){html=`<div class="card"><div class="toolbar"><h3>إدارة المشتركين</h3><div><input id="userSearch" placeholder="بحث بالاسم أو الهاتف"><button class="primary" id="addUser">إضافة مشترك</button><button class="secondary" id="exportUsers">تصدير CSV</button></div></div><div id="usersTable">${usersTable(db.users)}</div></div>`}
else if(admin&&activePage==='packages'){html=`<div class="card"><h3>إضافة باقة</h3><form id="pkgForm" class="grid"><div class="field"><label>الاسم</label><input id="pName" required></div><div class="field"><label>السعر ($)</label><input id="pPrice" type="number" min="0" step=".01" required></div><div class="field"><label>السرعة (KB)</label><input id="pSpeed" type="number" min="1" required></div><div class="field"><label>خصم الجدد (%)</label><input id="pDiscount" type="number" min="0" max="100" value="10" required></div><div class="field"><label>السعة (GB)</label><input id="pLimit" type="number" min="1" value="100" required></div><div class="field"><label>السرعة بعد السعة (KB)</label><input id="pThrottle" type="number" min="1" value="512" required></div><button class="success">إضافة الباقة</button></form></div><div class="card">${table(['الباقة','السعر','السرعة','الخصم','السعة','إجراء'],db.packages.map(p=>`<tr><td>${esc(p.name)}</td><td>${money(p.price)}</td><td>${p.speedKb} KB</td><td>${p.discountNew}%</td><td>${p.limitGb} GB</td><td>${btn('حذف','danger','delpkg:'+p.id)}</td></tr>`).join(''))}</div><div class="card"><h3>أسعار التركيب والعتاد ($)</h3><form id="hardwareForm" class="grid">${[['installation','أجور التركيب'],['cableM','سعر متر الكبل'],['dish','سعر الصحن'],['router','سعر الراوتر'],['box','توصيل العلبة']].map(([k,l])=>`<div class="field"><label>${l}</label><input name="${k}" type="number" min="0" step=".01" value="${db.hardware[k]}" required></div>`).join('')}<button class="success">حفظ الأسعار</button></form></div>`}
else if(admin&&activePage==='finance'){html=`<div class="card"><h3>شروط السداد</h3><form id="financeForm" class="grid"><div class="field"><label>مهلة السداد بالأيام</label><input id="debtDays" type="number" min="0" value="${db.finance.debtDays}" required></div><div class="field"><label>الحد الأدنى للدفعة ($)</label><input id="minPay" type="number" min="0" step=".01" value="${db.finance.minPayment}" required></div><button class="success">حفظ</button></form><p>الفصل هنا حالة داخل النظام المحلي فقط؛ لا يوقف الخدمة فعليًا على MikroTik.</p></div>`}
else if(admin&&activePage==='support'){html=`<div class="card"><h3>تذاكر الدعم</h3>${table(['المشترك','الموضوع','الرسالة','التاريخ','الحالة','إجراء'],db.tickets.map(t=>`<tr><td>${esc(t.userName)}<br>${esc(t.phone)}</td><td>${esc(t.subject)}</td><td>${esc(t.body)}<br><b>الرد:</b> ${esc(t.reply||'—')}</td><td>${esc(t.date)}</td><td>${esc(t.status)}</td><td>${btn('رد','primary','reply:'+t.id)}</td></tr>`).join(''))}</div>`}
else if(admin&&activePage==='settings'){html=`<div class="card"><h3>إعدادات الدفع والإعلان</h3><form id="settingsForm"><div class="field"><label>رقم الحساب / IBAN</label><input id="iban" value="${esc(db.settings.iban)}"></div><div class="field"><label>رابط صورة QR</label><input id="qr" type="url" value="${esc(db.settings.qr)}" placeholder="https://..."></div><div class="field"><label>نص إعلان شاشة الدخول</label><input id="ticker" value="${esc(db.settings.ticker)}"></div><button class="primary">حفظ</button></form><p class="notice">لا تخزن مفاتيح Firebase أو GitHub السرية داخل ملف HTML عام. إعدادات هذه النسخة لا تنشئ اتصالًا سحابيًا.</p><button class="danger" id="reset">مسح كل البيانات المحلية</button></div>`}
else if(admin&&activePage==='logs'){html=`<div class="card"><h3>سجل النشاطات</h3>${table(['التاريخ','المستخدم','العملية'],db.logs.map(l=>`<tr><td>${esc(l.date)}</td><td>${esc(l.user)}</td><td>${esc(l.action)}</td></tr>`).join(''))}</div>`}
else if(!admin&&activePage==='home'){const u=db.users.find(x=>x.id===session.id)||session;const p=db.packages.find(x=>x.name===u.pkgName);const used=Number(u.usedGb)||0,limit=p?.limitGb||100;html=`<div class="stats"><div class="stat"><small>الباقة</small><strong>${esc(u.pkgName)}</strong></div><div class="stat"><small>الانتهاء</small><strong>${esc(u.exp)}</strong></div><div class="stat"><small>الدين</small><strong>${money(u.debt)}</strong></div></div><div class="card"><h3>بيانات الاتصال</h3><p>اسم PPPoE: <b>${esc(u.pppoeUser)}</b></p><p>كلمة مرور PPPoE: <b>${esc(u.pppoePass)}</b></p><p>الحالة: <span class="badge">${esc(u.status)}</span></p><p>السرعة الاسمية: ${p?.speedKb||'—'} KB</p><p>الاستهلاك المسجل: ${used} / ${limit} GB</p><div class="bar"><span style="width:${Math.min(100,used/limit*100)}%"></span></div><p class="muted">عداد الاستهلاك يدوي في هذه النسخة، وليس قراءة مباشرة من جهاز الشبكة.</p></div>`}
else if(!admin&&activePage==='pay'){const u=db.users.find(x=>x.id===session.id)||session;html=`<div class="card"><h3>طلب تسديد دين أو تجديد</h3><p>الدين المسجل: <b>${money(u.debt)}</b></p>${db.settings.qr?`<p><a href="${esc(db.settings.qr)}" target="_blank" rel="noopener">عرض QR للدفع</a></p>`:''}${db.settings.iban?`<p>حساب التحويل: <code>${esc(db.settings.iban)}</code></p>`:''}<form id="payForm"><div class="grid"><div class="field"><label>نوع الطلب</label><select id="payType"><option value="تسديد دين">تسديد دين</option><option value="تجديد باقة">تجديد باقة</option></select></div><div class="field"><label>المبلغ ($)</label><input id="payAmount" type="number" min=".01" step=".01" required></div><div class="field"><label>رقم عملية التحويل</label><input id="payTxn" required maxlength="100"></div></div><button class="success">إرسال للمراجعة</button></form><p class="notice">إرسال رقم العملية لا يثبت وصول الأموال؛ الإدارة تتحقق منها يدويًا.</p></div>`}
else if(!admin&&activePage==='support'){const u=db.users.find(x=>x.id===session.id)||session;html=`<div class="card"><h3>إرسال تذكرة دعم</h3><form id="ticketForm"><div class="field"><label>الموضوع</label><input id="ticketSubject" required></div><div class="field"><label>التفاصيل</label><textarea id="ticketBody" required rows="4"></textarea></div><button class="primary">إرسال التذكرة</button></form></div><div class="card"><h3>تذاكري</h3>${table(['الموضوع','التاريخ','الحالة','الرد'],db.tickets.filter(t=>t.phone===u.phone).map(t=>`<tr><td>${esc(t.subject)}</td><td>${esc(t.date)}</td><td>${esc(t.status)}</td><td>${esc(t.reply||'بانتظار الرد')}</td></tr>`).join(''))}</div>`}
$('content').innerHTML=html;bindPageEvents()}
function usersTable(users){return table(['الاسم والهاتف','PPPoE','الباقة','الانتهاء','الدين','الحالة','إجراءات'],users.map(u=>`<tr><td>${esc(u.name)}<br>${esc(u.phone)}</td><td>${esc(u.pppoeUser)}</td><td>${esc(u.pkgName)}</td><td>${esc(u.exp)}</td><td>${money(u.debt)}</td><td>${esc(u.status)}</td><td>${btn('تعديل','primary','edit:'+u.id)} ${btn(u.status==='نشط'?'إيقاف':'تفعيل','warning','toggle:'+u.id)} ${btn('حذف','danger','delete:'+u.id)}</td></tr>`).join(''))}
function bindPageEvents(){
$('content').querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));
if($('userSearch'))$('userSearch').oninput=()=>{$('usersTable').innerHTML=usersTable(db.users.filter(u=>(u.name+u.phone+u.pppoeUser).toLowerCase().includes($('userSearch').value.toLowerCase())))};
if($('addUser'))$('addUser').onclick=()=>modal('إضافة مشترك',`<form id="manualUser"><div class="grid"><div class="field"><label>الاسم</label><input id="muName" required></div><div class="field"><label>الهاتف</label><input id="muPhone" required></div><div class="field"><label>كلمة المرور</label><input id="muPass" minlength="8" required></div><div class="field"><label>الباقة</label><select id="muPkg">${db.packages.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>الدين ($)</label><input id="muDebt" type="number" min="0" step=".01" value="0"></div></div><button class="success">إضافة</button></form>`);
if($('manualUser'))$('manualUser').onsubmit=e=>{e.preventDefault();if(db.users.some(u=>u.phone===$('muPhone').value.trim()))return alert('الهاتف مسجل مسبقًا');const u={id:String(Date.now()),role:'client',name:$('muName').value.trim(),phone:$('muPhone').value.trim(),password:$('muPass').value,pkgName:$('muPkg').value,debt:Number($('muDebt').value)||0,usedGb:0,pppoeUser:'hn_'+Date.now().toString().slice(-8),pppoePass:'غير مُنشأ',exp:datePlus(30),status:'نشط',staticIp:'DHCP'};db.users.push(u);persist();log('إضافة مشترك يدوي: '+u.phone);closeModal();render()};
if($('pkgForm'))$('pkgForm').onsubmit=e=>{e.preventDefault();db.packages.push({id:Date.now(),name:$('pName').value.trim(),price:Number($('pPrice').value),speedKb:Number($('pSpeed').value),discountNew:Number($('pDiscount').value),limitGb:Number($('pLimit').value),throttledKb:Number($('pThrottle').value),days:30});persist();log('إضافة باقة');render()};
if($('hardwareForm'))$('hardwareForm').onsubmit=e=>{e.preventDefault();db.hardware=Object.fromEntries(new FormData(e.target).entries());for(const k in db.hardware)db.hardware[k]=Number(db.hardware[k]);persist();alert('تم حفظ الأسعار');render()};
if($('financeForm'))$('financeForm').onsubmit=e=>{e.preventDefault();db.finance={debtDays:Number($('debtDays').value),minPayment:Number($('minPay').value)};persist();log('تعديل شروط السداد');alert('تم الحفظ')};
if($('settingsForm'))$('settingsForm').onsubmit=e=>{e.preventDefault();db.settings={iban:$('iban').value.trim(),qr:$('qr').value.trim(),ticker:$('ticker').value.trim()};persist();log('تعديل إعدادات الدفع');alert('تم الحفظ')};
if($('ticketForm'))$('ticketForm').onsubmit=e=>{e.preventDefault();const u=db.users.find(x=>x.id===session.id)||session;db.tickets.unshift({id:String(Date.now()),phone:u.phone,userName:u.name,subject:$('ticketSubject').value.trim(),body:$('ticketBody').value.trim(),reply:'',status:'قيد الانتظار',date:new Date().toLocaleString('ar')});persist();log('إرسال تذكرة دعم');render();alert('تم إرسال التذكرة')};
if($('payForm'))$('payForm').onsubmit=e=>{e.preventDefault();const u=db.users.find(x=>x.id===session.id)||session;const type=$('payType').value,amount=Number($('payAmount').value),txn=$('payTxn').value.trim();if(amount<=0||!txn)return alert('تحقق من المبلغ ورقم العملية');if(type==='تسديد دين'&&amount>Number(u.debt||0))return alert('المبلغ أكبر من الدين المسجل');db.requests.unshift({id:String(Date.now()),phone:u.phone,name:u.name,type,pkgName:u.pkgName,paidAmount:amount,txn,status:'بانتظار الموافقة',date:new Date().toLocaleString('ar')});persist();log('طلب '+type+' للمشترك '+u.phone);render();alert('تم إرسال الطلب للمراجعة اليدوية')};
if($('exportUsers'))$('exportUsers').onclick=()=>csv('hinon-users.csv',db.users);
if($('exportReq'))$('exportReq').onclick=()=>csv('hinon-requests.csv',db.requests);
if($('reset'))$('reset').onclick=()=>{if(confirm('سيتم حذف جميع بيانات HINON المحفوظة في هذا المتصفح. هل تريد المتابعة؟')){localStorage.removeItem(KEY);location.reload()}};
}
function act(action){const [kind,id]=action.split(':');if(kind==='approve'){const r=db.requests.find(x=>x.id===id);if(!r)return;if(!confirm('تأكيد مراجعة الطلب والموافقة عليه؟'))return;const u=db.users.find(x=>x.id===r.id||x.phone===r.phone);if(u){if(r.type==='اشتراك جديد'){u.status='نشط';u.exp=datePlus(30);u.debt=Math.max(0,Number(r.debt)||0);u.pppoePass='يُحدد يدويًا';}else if(r.type==='تسديد دين'){u.debt=Math.max(0,(Number(u.debt)||0)-Number(r.paidAmount||0));if(u.debt===0&&u.status==='مفصول لعدم السداد')u.status='نشط'}else if(r.type==='تجديد باقة'){u.exp=datePlus(30);u.usedGb=0;u.status='نشط'}}db.requests=db.requests.filter(x=>x.id!==id);persist();log('الموافقة على الطلب '+id);render();return}
if(kind==='reject'){const r=db.requests.find(x=>x.id===id);if(!r)return;if(!confirm('رفض الطلب؟'))return;const u=db.users.find(x=>x.id===r.id);if(u&&r.type==='اشتراك جديد')u.status='مرفوض';db.requests=db.requests.filter(x=>x.id!==id);persist();log('رفض الطلب '+id);render();return}
if(kind==='txn'){const r=db.requests.find(x=>x.id===id);if(!r)return;const value=prompt('رقم عملية التحويل بعد التحقق اليدوي:',r.txn||'');if(value!==null){r.txn=value.trim();persist();log('تحديث رقم عملية');render()}return}
if(kind==='delpkg'){if(db.users.some(u=>u.pkgName===db.packages.find(p=>String(p.id)===id)?.name))return alert('لا يمكن حذف باقة مستخدمة من مشترك');if(confirm('حذف الباقة؟')){db.packages=db.packages.filter(p=>String(p.id)!==id);persist();render()}return}
if(kind==='toggle'){const u=db.users.find(x=>x.id===id);if(u){u.status=u.status==='نشط'?'موقوف':'نشط';persist();log('تغيير حالة '+u.phone);render()}return}
if(kind==='delete'){if(confirm('حذف المشترك نهائيًا؟')){db.users=db.users.filter(u=>u.id!==id);persist();log('حذف مشترك');render()}return}
if(kind==='edit'){const u=db.users.find(x=>x.id===id);if(!u)return;modal('تعديل المشترك',`<form id="editUser"><div class="grid"><div class="field"><label>الاسم</label><input id="euName" value="${esc(u.name)}" required></div><div class="field"><label>الدين ($)</label><input id="euDebt" type="number" min="0" step=".01" value="${Number(u.debt)||0}" required></div><div class="field"><label>تاريخ الانتهاء</label><input id="euExp" type="date" value="${/^\d{4}-\d{2}-\d{2}$/.test(u.exp)?u.exp:''}"></div><div class="field"><label>الباقة</label><select id="euPkg">${db.packages.map(p=>`<option ${p.name===u.pkgName?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>الاستهلاك (GB)</label><input id="euUsed" type="number" min="0" value="${Number(u.usedGb)||0}"></div><div class="field"><label>الحالة</label><select id="euStatus">${['نشط','موقوف','مفصول لعدم السداد','بانتظار الموافقة','مرفوض'].map(s=>`<option ${s===u.status?'selected':''}>${s}</option>`).join('')}</select></div></div><button class="primary">حفظ التعديل</button></form>`);$('editUser').onsubmit=e=>{e.preventDefault();u.name=$('euName').value.trim();u.debt=Number($('euDebt').value)||0;u.exp=$('euExp').value||'غير مفعل';u.pkgName=$('euPkg').value;u.usedGb=Number($('euUsed').value)||0;u.status=$('euStatus').value;persist();log('تعديل مشترك '+u.phone);closeModal();render()};return}
if(kind==='reply'){const t=db.tickets.find(x=>x.id===id);if(!t)return;const answer=prompt('اكتب رد الإدارة:',t.reply||'');if(answer!==null){t.reply=answer.trim();t.status='تم الرد';persist();log('الرد على تذكرة '+t.phone);render()}}
}
function csv(filename,rows){if(!rows.length)return alert('لا توجد بيانات للتصدير');const keys=[...new Set(rows.flatMap(Object.keys))];const quote=v=>'"'+String(typeof v==='object'&&v!==null?JSON.stringify(v):v??'').replace(/"/g,'""')+'"';const text='\ufeff'+[keys.map(quote).join(','),...rows.map(r=>keys.map(k=>quote(r[k])).join(','))].join('\r\n');const blob=new Blob([text],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url)}
$('logout').onclick=()=>{session=null;activePage='home';screen('login')};
init();
</script>
</body></html>
